name: Daily Stock Push

on:
  schedule:
    # 分 時 日 月 星期。UTC 07:30 等於台灣時間 15:30 (週一到週五工作日執行)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊測試

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # 👈 只要加上這行，GitHub 就會自動幫你快取套件了！

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行資料抓取
        run: python fetch_cache.py

      - name: 發送 Telegram 推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: 自動將快取存回 GitHub (自動更新網頁版)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update daily cache"
          git push
