name: Daily Stock Push

# ──────────────────────────────────────────────────────────────────────
# 兩段式排程設計(由 cron-job.org 外部觸發 workflow_dispatch)
#
# 階段 quick (16:10 台北) ── 收盤快照
#   執行 fetch_cache.py --force-daily 強制重抓 daily,
#   確保拿到真實收盤價(覆蓋使用者盤中可能按過的「即時價」)
#   不發 TG(因 TPEx 資券要等 18:00 後才公告,此時資料不完整)
#
# 階段 full (21:10 台北) ── 完整資料 + 推播
#   再次 fetch_cache(daily 沿用 16:10 真收盤,只補 TPEx 資券、營收等)
#   執行完成後發 TG 推播,一天就這一則
#
# cron-job.org body 應傳:
#   16:10 cronjob → {"ref":"main","inputs":{"phase":"quick"}}
#   21:10 cronjob → {"ref":"main","inputs":{"phase":"full"}}
#
# 手動點擊 GitHub 的 Run workflow 按鈕預設跑 full(完整含推播)
# ──────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      phase:
        description: '階段:quick(僅快照不推播) / full(完整+推播)'
        required: false
        default: 'full'
        type: choice
        options:
          - quick
          - full

# ── 消除 Node.js 20 警告 ─────────────────────────────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: quick 階段(16:10) ── 收盤快照,不推播
  # --force-daily 確保覆蓋盤中可能寫入的即時價,拿真實收盤
  # ════════════════════════════════════════════════════════════════
  cache-only:
    if: ${{ inputs.phase == 'quick' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行資料抓取(quick 收盤快照,強制重抓 daily)
        run: python -u fetch_cache.py --force-daily

      - name: 將快取存回 GitHub(更新網頁版)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update daily cache (quick 16:10 snapshot)"
          git pull --rebase origin main || true
          git push origin HEAD

  # ════════════════════════════════════════════════════════════════
  # Job 2: full 階段(21:10 + 手動觸發預設) ── 完整流程 + TG 推播
  # daily 在 16:10 已抓過真收盤,這裡不再強制重抓
  # fetch_cache 內部會自動補 TPEx 資券、營收等仍缺的資料
  # ════════════════════════════════════════════════════════════════
  full-push:
    if: ${{ inputs.phase == 'full' || inputs.phase == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行完整資料抓取(TPEx 資券已公告,daily 沿用 16:10 真收盤)
        run: python -u fetch_cache.py

      - name: 發送 Telegram 推播
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python -u telegram_notify.py

      - name: 將快取存回 GitHub(更新網頁版)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update daily cache (full 21:10)"
          git pull --rebase origin main || true
          git push origin HEAD
