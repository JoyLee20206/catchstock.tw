name: Daily Stock Push

# ──────────────────────────────────────────────────────────────────────
# 兩段式排程設計
#
# 16:05 (台北) = UTC 08:05 ── 收盤後第一輪
#   只執行 fetch_cache,讓 Streamlit 網頁能看到當日 K 線、法人、TWSE 
#   不發 TG(因 TPEx 資券要等 18:00 後才公告,此時資料不完整)
#
# 21:05 (台北) = UTC 13:05 ── 完整資料就緒
#   再次 fetch_cache(此時 TPEx 資券、所有資料都齊),然後發 TG
#   這是「正式」推播,一天就這一則
#
# 手動觸發(workflow_dispatch)預設行為等同 21:05 完整流程
# ──────────────────────────────────────────────────────────────────────

on:
  schedule:
   # - cron: '5 8 * * 1-5'    # 16:05 台北 — 只更新 cache,不推播
   # - cron: '5 13 * * 1-5'   # 21:05 台北 — 完整流程含推播
  workflow_dispatch:          # 允許手動點擊測試(預設跑完整流程)

# ── 消除 Node.js 20 警告 ────────────────────
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: 16:05 — 收盤快照
  # 只跑 fetch_cache + commit,讓網頁有最新資料,但不推播
  # ════════════════════════════════════════════════════════════════
  cache-only:
    # 只在 16:05 排程觸發時跑(手動觸發不跑這個 job)
    if: github.event.schedule == '5 8 * * 1-5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行資料抓取(16:05 收盤快照)
        run: python fetch_cache.py --force-daily

      - name: 將快取存回 GitHub(更新網頁版)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update daily cache (16:05 snapshot)"
          git pull --rebase origin main || true
          git push origin HEAD

  # ════════════════════════════════════════════════════════════════
  # Job 2: 21:05 + 手動觸發 — 完整流程
  # 此時 TPEx 資券已公告(18:00 後),所有資料都齊,正式推播
  # ════════════════════════════════════════════════════════════════
  full-push:
    # 21:05 排程 或 手動觸發 都跑這個
    if: github.event.schedule == '5 13 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行完整資料抓取(此時 TPEx 資券已公告)
        # 16:05 已抓過 daily 且收盤價穩定,不需重抓。
        # margin 的 batch 邏輯會自動偵測「今天不在 existing_dates」並補抓 TPEx 資券。
        # 其他資源已有當日 cache 也會略過,只跑必要的補抓,通常 1~2 分鐘搞定。
        run: python -u fetch_cache.py

      - name: 發送 Telegram 推播
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python telegram_notify.py

      - name: 將快取存回 GitHub(更新網頁版)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cache/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update daily cache (21:05 full)"
          git pull --rebase origin main || true
          git push origin HEAD
